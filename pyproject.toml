[project]
name = "bansi-agentic-ai-lab"
version = "0.1.0"
description = "Hands-on agentic AI learning and production-pattern portfolio."
requires-python = ">=3.11"
readme = "README.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
